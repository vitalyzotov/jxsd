name: ci

on:
  push:
    # Tag pushes are handled by release.yml; only branch pushes run CI here.
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        # verify runs the test suite plus Checkstyle, SpotBugs and the JaCoCo
        # coverage gate (>= 80% line coverage).
        run: mvn --batch-mode --no-transfer-progress verify